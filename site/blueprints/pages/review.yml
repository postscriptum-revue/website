title: Compte-rendu

options:
    changeTemplate:
        - article
        - interview
        - review

columns:
    left:
        width: 2/3
        fields:
            title: fields/article-title
            abstracts: fields/abstracts
            text: fields/text
            bibliography:
                type: list
                label: Bibliographie
    right:
        width: 1/3
        sections:
            details:
                type: fields
                fields:
                    details: fields/article-details
                    date:
                        type: date
                        label: Date de publication
            generate-pdf:
                type: article-pdf
                label: Générer le PDF

